<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSC02 robot telemetry</title>
<style>body{font:17px system-ui;max-width:1100px;margin:3rem auto;padding:0 1rem;background:#101821;color:#e6eef6}h1{font-size:2rem}#status{padding:1rem;background:#233347;border-radius:8px}.bad{color:#ffb2a6}.good{color:#88dfb2}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem;border-bottom:1px solid #34475a}th{color:#adc3d8}caption{text-align:left;font-size:1.3rem;margin:1.5rem 0}.muted{color:#adc3d8}</style>
<h1>CSC02 robot telemetry</h1><p class="muted">Live observations from the robot. Commanded power describes PWM output. Height is a calibrated estimate.</p>
<p id="status">Waiting for telemetry</p><div id="data"></div>
<script>
'use strict';
const phases=['Disarmed','Line tracking','Acquisition','Turn out','Approach','Align','Pass obstacle','Turn in','Return','Restore heading','Line reacquisition','Navigation turn','Fault'];
const faults=['None','Sensor unavailable','Line unavailable','Shock','Transport','Command expired','Calibration required','Motor','Reserved'];
const groups=[['Controller',['phase','fault','command','power','motor_state','sequence','time_ms']],['Measured motion',['left_counts','right_counts','speed_mm_s']],['Line and barcode',['line_state','ir0','ir1','ir2','black_mask','line_error','barcode','navigation']],['Terrain',['ax_mg','ay_mg','az_mg','mx_raw','my_raw','mz_raw','pitch_cdeg','roll_cdeg','terrain','height_mm','highest_mm']],['Obstacle scan',['distance_mm','width_mm','servo_deg','scan_state','quality','dropped']]];
function valid(k,t){let a=t.available;if(k.startsWith('ir')||['line_state','black_mask','line_error'].includes(k))return a&4;if(k==='speed_mm_s')return t.quality&16;if(k.endsWith('counts'))return a&2;if(['mx_raw','my_raw','mz_raw'].includes(k))return a&128;if(k.includes('_mg'))return a&8;if(k.includes('cdeg'))return a&32;if(k==='height_mm')return a&64;if(k==='highest_mm')return t.highest_mm>0;if(k==='distance_mm')return a&16;if(k==='width_mm')return t.quality&1;return true;}
async function refresh(){try{let p=await(await fetch('/api/telemetry',{cache:'no-store'})).json();const s=document.querySelector('#status');s.className=p.stale?'bad':'good';s.textContent=p.stale?'No current data — values below are historical':`Receiving · ${p.age_ms} ms since last packet · ${p.rejected} rejected packets`;let t=p.telemetry;if(!t)return;let d=document.querySelector('#data');d.replaceChildren();for(let [title,keys]of groups){let table=document.createElement('table'),cap=document.createElement('caption');cap.textContent=title;table.append(cap);for(let k of keys){let tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=k.replaceAll('_',' ');td.textContent=valid(k,t)?k==='phase'?phases[t[k]]:k==='fault'?faults[t[k]]:String(t[k]):'Unavailable';tr.append(th,td);table.append(tr);}d.append(table);}}catch(e){document.querySelector('#status').textContent='Dashboard connection unavailable';}setTimeout(refresh,300);}refresh();
</script></html>
